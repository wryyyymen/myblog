services:
  backend:
    image: myblog-backend:local
    pull_policy: never
    network_mode: host
    restart: unless-stopped
    mem_limit: 768m
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/myblog
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-blog_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env or pass --env-file}
      ROBOT_TCP_ENABLED: ${ROBOT_TCP_ENABLED:-false}
      ROBOT_TCP_BIND_ADDRESS: ${ROBOT_TCP_BIND_ADDRESS:-0.0.0.0}
      ROBOT_TCP_PORT: ${ROBOT_TCP_PORT:-54321}
      ROBOT_TCP_ALLOWED_REMOTE_ADDRESS: ${ROBOT_TCP_ALLOWED_REMOTE_ADDRESS:-}
      ROBOT_WORKER_HOST: ${ROBOT_WORKER_HOST:-127.0.0.1}
      ROBOT_WORKER_PORT: ${ROBOT_WORKER_PORT:-54322}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_SQL_INIT_MODE: never
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m
